name: Working branch website regression
on:
  push:
    branches:
      - implementation/comments-2026-11-15
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: node --check dist/app.js
      - name: Test catalog outage, deep links and navigation state
        run: node --test tests/website-ui.test.mjs
