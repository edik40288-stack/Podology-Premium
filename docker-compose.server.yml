# Backward-compatible alias. For production use docker-compose.production.yml.
services:
  api:
    build:
      context: ./backend
    container_name: podolog-kutsytoi-api-local
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    volumes:
      - ./backend/data:/app/data
      - ./backend/storage:/app/storage
      - ./backend/content:/app/content
