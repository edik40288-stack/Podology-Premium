services:
  postgres:
    image: postgres:16-alpine
    container_name: podolog-kutsytoi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-podolog}
      POSTGRES_USER: ${POSTGRES_USER:-podolog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_password}
    volumes:
      - podolog_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-podolog} -d ${POSTGRES_DB:-podolog}"]
      interval: 10s
      timeout: 5s
      retries: 8

  api:
    build:
      context: ./backend
    container_name: podolog-kutsytoi-api
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - podolog_storage:/app/storage
      - ./backend/content:/app/content
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 8

volumes:
  podolog_postgres:
  podolog_storage:
